# Builds the site and publishes it to GitHub Pages
# (https://lunariastudios.dev/, custom domain set under Settings → Pages).
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
# Docs: https://docs.astro.build/en/guides/deploy/github/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build and upload
        uses: withastro/action@v6
        with:
          node-version: 22
        # Custom domain at the root: no sub-path. SITE_URL is in src/config.ts.
        env:
          BASE_PATH: ''

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
